<text x="44" y="46" class="tag">SEVEN-ELEVEN · SALES INTELLIGENCE</text>
<text x="44" y="91" class="title">데이터에서 전략의 단서까지</text><text x="44" y="124" class="sub">보존된 매출과 콘텐츠를 조회하고, 이상 변동을 Slack과 대시보드에서 함께 살펴봅니다.</text>
<rect x="44" y="174" width="310" height="245" rx="16" fill="#ffffff" stroke="#cbd9d0"/>
<text x="68" y="206" class="tag">01 / DATA · AIVEN</text><text x="68" y="239" class="heading">PostgreSQL</text>
<text x="68" y="272" class="body">all_sale · 매출 / 증감률 / 편차</text>
<text x="68" y="299" class="body">news_search · 관련 뉴스</text>
<text x="68" y="326" class="body">ytb_video · 관련 영상</text>
<text x="68" y="353" class="body">원본 데이터는 저장소에 미포함</text>
<rect x="414" y="174" width="330" height="245" rx="16" fill="#ffffff" stroke="#cbd9d0"/>
<text x="438" y="206" class="tag">02 / BOT SERVER · RENDER</text><text x="438" y="239" class="heading">조회 · 분석 · 알림</text>
<text x="438" y="272" class="body">브랜드 증감률 − 3사 평균</text>
<text x="438" y="299" class="body">2024년 고정 5·95백분위 판정</text>
<text x="438" y="326" class="body">해당 날짜의 뉴스·영상 연결</text>
<text x="438" y="353" class="body">Socket Mode로 Slack과 연결</text>
<rect x="804" y="174" width="352" height="245" rx="16" fill="#eaf3ed" stroke="#cbd9d0"/>
<text x="828" y="206" class="tag">03 / EXPERIENCE · SLACK</text><text x="828" y="239" class="heading">세븐일레븐 매출 전략</text>
<text x="828" y="272" class="body">멘션으로 매출·콘텐츠 조회</text>
<text x="828" y="299" class="body">앱 홈에서 날짜·브랜드 선택</text>
<text x="828" y="326" class="body">요약 · 그래프 이미지 갱신</text>
<text x="828" y="353" class="body">이상치 알림에서 상세 분석 이동</text>
<path d="M354 290H410" class="line"/>
<path d="M744 290H800" class="line"/>
<rect x="44" y="502" width="310" height="190" rx="16" fill="#edf1f8" stroke="#cbd9d0"/>
