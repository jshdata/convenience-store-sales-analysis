<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">데이터에서 전략의 단서까지</title><desc id="desc">보존된 매출과 콘텐츠를 조회하고, 이상 변동을 Slack과 대시보드에서 함께 살펴봅니다.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#53796b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#243d35}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#60776d}.heading{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#60776d}.tag{font-size:13px;font-weight:700;letter-spacing:1px;fill:#447761}.line{fill:none;stroke:#53796b;stroke-width:2;marker-end:url(#arrow)}</style>
