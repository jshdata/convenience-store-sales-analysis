<rect x="804" y="502" width="352" height="190" rx="16" fill="#eaf3ed" stroke="#cbd9d0"/>
<text x="828" y="534" class="tag">DETAIL / STREAMLIT</text><text x="828" y="567" class="heading">대화형 대시보드</text>
